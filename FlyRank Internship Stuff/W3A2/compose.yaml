services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Within the docker-compose network, the database host is 'db' (the service name)
      DATABASE_URL: postgresql://postgres:dev@db:5432/tasks
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: taskdb # Naming it taskdb keeps your verification commands working
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "5433:5432" # Map 5433 on your machine to 5432 in the container
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata:
