<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Background Switch</title>
    <script src="https://cdn.tailwindcss.com"></script>  <!-- Tailwind CDN -->
</head>
<body class="h-screen flex flex-col items-center justify-center transition-colors duration-500">
    <h1 class="text-3xl font-bold mb-4">Click to Change Background! 🎨</h1>

    <!-- Buttons to change background -->
    <div class="flex space-x-4">
        <button class="bg-red-500 px-4 py-2 text-white rounded" onclick="document.body.className='bg-red-500 h-screen flex flex-col items-center justify-center transition-colors duration-500'">Red</button>

        <button class="bg-green-500 px-4 py-2 text-white rounded" onclick="document.body.className='bg-green-500 h-screen flex flex-col items-center justify-center transition-colors duration-500'">Green</button>

        <button class="bg-blue-500 px-4 py-2 text-white rounded" onclick="document.body.className='bg-blue-500 h-screen flex flex-col items-center justify-center transition-colors duration-500'">Blue</button>
    </div>
</body>
</html>
